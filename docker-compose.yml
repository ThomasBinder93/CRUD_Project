services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      SERVER_READ_TIMEOUT: "15"
      SERVER_WRITE_TIMEOUT: "15"
      DB_PATH: "/data/crud.db"
      LOG_LEVEL: "info"
    volumes:
      - ./data:/data
    restart: unless-stopped
    container_name: crud-demo
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s