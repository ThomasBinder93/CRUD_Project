<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>CRUD Demo</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        input { margin-right: 10px; }
        li { margin: 5px 0; }
    </style>
</head>
<body>

<h1>CRUD Demo</h1>

<div id="message" style="color: green; margin-bottom: 20px;"></div>

<div style="margin-bottom: 20px;">
    <input id="searchInput" placeholder="Suche nach Name oder Beschreibung">
    <button onclick="searchItems()">Suchen</button>
    <button onclick="clearSearch()">Zurücksetzen</button>
</div>

<input id="nameInput" placeholder="Name">
<input id="descriptionInput" placeholder="Description">
<select id="statusInput">
    <option value="active">active</option>
    <option value="completed">completed</option>
    <option value="archived">archived</option>
</select>
<button onclick="createItem()">Erstellen</button>

<table id="list"></table>

    <script src="helper.js"></script>
    <script src="script.js?v=3"></script>
</body>
</html>
